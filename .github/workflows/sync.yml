name: 强力规则定时合并重组流

on:
  schedule:
    # 每天北京时间凌晨 04:00 (UTC 20:00) 自动触发
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持你随时在 GitHub 网页上手动点击按钮触发

jobs:
  merge_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 🌟 新增这一步：强制让 GitHub 服务器安装我们在代码里引入的高级依赖库
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyYAML tldextract
          
      - name: Run Generate Script
        run: python generate.py
        
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ruleset/*.yaml
          git commit -m "Auto update clash rules with PSL purifier" || exit 0
          git push
